services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: sewasetu
      POSTGRES_USER: sewasetu
      POSTGRES_PASSWORD: sewasetu123
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./app/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./seed/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql

  app:
    build: ./app
    ports:
      - "8000:8000"
    depends_on:
      - db
      - smsgw
    volumes:
      - uploads:/var/sewasetu/uploads
      - applogs:/var/log/sewasetu
    # Secrets are loaded from .env (local dev) or set directly in production.
    # .env is git-ignored and must never be committed.
    # In production (FLASK_ENV=production) the app refuses to start with
    # the leaked defaults — set all three vars explicitly.
    env_file:
      - path: .env
        required: false   # graceful if .env absent; env vars may be set another way
    environment:
      SECRET_KEY:     ${SECRET_KEY:-ssp-prod-key-2023-donotshare}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-sewasetu@123}

  scheduler:
    build: ./app
    command: ["cron", "-f"]
    depends_on:
      - db
    volumes:
      - applogs:/var/log/sewasetu
    env_file:
      - path: .env
        required: false
    environment:
      SECRET_KEY:     ${SECRET_KEY:-ssp-prod-key-2023-donotshare}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-sewasetu@123}

  smsgw:
    build: ./smsgw
    # internal only — reached by the app over the docker network and exposed to
    # users via the app at /__gateway/ (so no second host port is needed)
    expose:
      - "8025"

volumes:
  pgdata:
  uploads:
  applogs:
